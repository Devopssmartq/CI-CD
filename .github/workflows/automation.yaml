name: Deploy Services (All Environments)

on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: |
          Select Release Scope:
          • sprint: Uses demo servers (smartqdemo-*)
          • preprod: Uses preprod servers (sqpreprod-*)
          • beta: Uses production US only (smartqprd-us)
          • prod: Uses all production servers (smartqprd-*)
          • hot-fix: Uses preprod + prod servers
        required: true
        default: 'sprint'
        type: choice
        options:
          - sprint
          - preprod
          - beta
          - prod
          - hot-fix
      
      git_branch:
        description: 'Hotfix branch name (required for hot-fix scope)'
        required: false
        type: string
        default: ''
      
      app_engine_project_id:
        description: |
          ⚠️  IMPORTANT: Select Project ID matching your Release Scope!
          
          🔵 SPRINT (demo servers ONLY):
          smartqdemo-au, smartqdemo-de, smartqdemo-hk, smartqdemo-nz, 
          smartqdemo-us, sqpentest, sqinternational-cicd
          
          🟡 PREPROD (preprod servers ONLY):
          sqpreprod-us, sqpreprod-spain, sqpreprod-de, sqpreprod-au,
          sqpreprod-hk, sqpreprod-jp, sqpreprod-sng, sqpreprod-nz
          
          🟣 BETA (US production ONLY):
          smartqprd-us
          
          🔴 PROD (production servers ONLY):
          All smartqprd-* servers
          
          🚨 HOT-FIX (preprod + production):
          All sqpreprod-* and smartqprd-* servers
        required: true
        type: choice
        options:
          # 🔵 SPRINT/DEMO SERVERS (use with release_scope: sprint)
          - "smartqdemo-au [SPRINT]"
          - "smartqdemo-de [SPRINT]"
          - "smartqdemo-hk [SPRINT]"
          - "smartqdemo-nz [SPRINT]"
          - "smartqdemo-us [SPRINT]"
          - "sqpentest [SPRINT]"
          - "sqinternational-cicd [SPRINT]"
          # 🟡 PREPROD SERVERS (use with release_scope: preprod)
          - "sqpreprod-us [PREPROD]"
          - "sqpreprod-spain [PREPROD]"
          - "sqpreprod-de [PREPROD]"
          - "sqpreprod-au [PREPROD]"
          - "sqpreprod-hk [PREPROD]"
          - "sqpreprod-jp [PREPROD]"
          - "sqpreprod-sng [PREPROD]"
          - "sqpreprod-nz [PREPROD]"
          # 🔴 PRODUCTION SERVERS (use with release_scope: prod, beta, or hot-fix)
          - "smartqprd-us [PROD/BETA/HOTFIX]"
          - "smartqprd-au [PROD/HOTFIX]"
          - "smartqprd-be [PROD/HOTFIX]"
          - "smartqprd-chi [PROD/HOTFIX]"
          - "smartqprd-cn [PROD/HOTFIX]"
          - "smartqprd-de [PROD/HOTFIX]"
          - "smartqprd-fi [PROD/HOTFIX]"
          - "smartqprd-hk [PROD/HOTFIX]"
          - "smartqprd-ph [PROD/HOTFIX]"
          - "smartqprd-it [PROD/HOTFIX]"
          - "smartqprd-jp [PROD/HOTFIX]"
          - "smartqprd-mex [PROD/HOTFIX]"
          - "smartqprd-nl [PROD/HOTFIX]"
          - "smartqprd-nz [PROD/HOTFIX]"
          - "smartqprd-sng [PROD/HOTFIX]"
          - "smartqprd-spain [PROD/HOTFIX]"
          - "smartqprd-uae [PROD/HOTFIX]"
          - "smartqprd-se [PROD/HOTFIX]"
        default: 'smartqdemo-us [SPRINT]'
      
      service_name:
        description: 'Service names (comma-separated) or "All" for all services'
        required: true
        type: string
        default: 'All'
      
      automation_pipeline:
        description: |
          Automation Pipeline:
          • none: No automation (default for sprint/beta)
          • Critical_Sanity: Standard critical tests
          • CD_pipeline_US: US-specific CD pipeline
          • Spain-Translation-Test_Suite: Spain-specific tests
        required: true
        type: choice
        options:
          - none
          - Critical_Sanity
          - CD_pipeline_US
          - Spain-Translation-Test_Suite
        default: 'none'
      
      description:
        description: 'Deployment description'
        required: false
        type: string
        default: ''

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate Parameters
        id: validate
        run: |
          RELEASE_SCOPE="${{ github.event.inputs.release_scope }}"
          PROJECT_ID_WITH_LABEL="${{ github.event.inputs.app_engine_project_id }}"
          
          # Extract actual project ID from the labeled selection
          PROJECT_ID=$(echo "$PROJECT_ID_WITH_LABEL" | sed 's/ \[.*\]//')
          
          echo "Validating parameters for $RELEASE_SCOPE deployment..."
          echo "Selected project: $PROJECT_ID"
          
          # Define valid projects for each scope
          case $RELEASE_SCOPE in
            "sprint")
              valid_projects="smartqdemo-au smartqdemo-de smartqdemo-hk smartqdemo-nz smartqdemo-us sqpentest sqinternational-cicd"
              required_label="SPRINT"
              echo "🔵 Sprint deployment - Demo servers only"
              ;;
            "preprod")
              valid_projects="sqpreprod-us sqpreprod-spain sqpreprod-de sqpreprod-au sqpreprod-hk sqpreprod-jp sqpreprod-sng sqpreprod-nz"
              required_label="PREPROD"
              echo "🟡 Preprod deployment - Preprod servers only"
              ;;
            "beta")
              valid_projects="smartqprd-us"
              required_label="PROD/BETA/HOTFIX"
              echo "🟣 Beta deployment - US production only"
              ;;
            "prod")
              valid_projects="smartqprd-au smartqprd-be smartqprd-chi smartqprd-cn smartqprd-de smartqprd-fi smartqprd-hk smartqprd-ph smartqprd-it smartqprd-jp smartqprd-mex smartqprd-nl smartqprd-nz smartqprd-sng smartqprd-spain smartqprd-uae smartqprd-us smartqprd-se"
              required_label="PROD"
              echo "🔴 Production deployment - All production servers"
              ;;
            "hot-fix")
              valid_projects="sqpreprod-us sqpreprod-spain sqpreprod-de sqpreprod-au sqpreprod-hk sqpreprod-jp sqpreprod-sng sqpreprod-nz smartqprd-au smartqprd-be smartqprd-chi smartqprd-cn smartqprd-de smartqprd-fi smartqprd-hk smartqprd-it smartqprd-jp smartqprd-mex smartqprd-nl smartqprd-nz smartqprd-sng smartqprd-spain smartqprd-uae smartqprd-us smartqprd-ph smartqprd-se"
              required_label="HOTFIX"
              echo "🚨 Hot-fix deployment - Preprod + Production servers"
              ;;
          esac
          
          # Validate project ID
          if [[ ! " $valid_projects " =~ " $PROJECT_ID " ]]; then
            echo ""
            echo "❌ ERROR: Project '$PROJECT_ID' is not valid for release scope '$RELEASE_SCOPE'"
            echo ""
            echo "🔍 Valid projects for $RELEASE_SCOPE:"
            for project in $valid_projects; do
              echo "  ✓ $project"
            done
            echo ""
            echo "💡 HINT: Make sure to select a server with the correct label [$required_label]"
            exit 1
          fi
          
          # Additional validation: Check if the selected option has the right label
          if [ "$RELEASE_SCOPE" = "sprint" ] && [[ ! "$PROJECT_ID_WITH_LABEL" == *"[SPRINT]"* ]]; then
            echo "❌ ERROR: For sprint deployments, please select a server labeled [SPRINT]"
            exit 1
          elif [ "$RELEASE_SCOPE" = "preprod" ] && [[ ! "$PROJECT_ID_WITH_LABEL" == *"[PREPROD]"* ]]; then
            echo "❌ ERROR: For preprod deployments, please select a server labeled [PREPROD]"
            exit 1
          elif [ "$RELEASE_SCOPE" = "beta" ] && [[ ! "$PROJECT_ID_WITH_LABEL" == *"[PROD/BETA/HOTFIX]"* ]]; then
            echo "❌ ERROR: For beta deployments, please select a server labeled [PROD/BETA/HOTFIX]"
            exit 1
          elif [ "$RELEASE_SCOPE" = "prod" ] && [[ ! "$PROJECT_ID_WITH_LABEL" == *"[PROD/HOTFIX]"* ]]; then
            echo "❌ ERROR: For production deployments, please select a server labeled [PROD/HOTFIX]"
            exit 1
          elif [ "$RELEASE_SCOPE" = "hot-fix" ] && [[ ! "$PROJECT_ID_WITH_LABEL" == *"HOTFIX"* ]]; then
            echo "❌ ERROR: For hot-fix deployments, please select a server labeled with HOTFIX"
            exit 1
          fi
          
          echo "✓ Project validation passed: $PROJECT_ID is valid for $RELEASE_SCOPE"
          
          # Hot-fix branch validation
          if [ "$RELEASE_SCOPE" = "hot-fix" ] && [ -z "${{ github.event.inputs.git_branch }}" ]; then
            echo "❌ ERROR: Git branch is required for hot-fix deployments"
            exit 1
          fi
          
          echo "validation_passed=true" >> $GITHUB_OUTPUT
          echo "clean_project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
      
      - name: Process Parameters
        id: process-params
        run: |
          SERVICE_NAME="${{ github.event.inputs.service_name }}"
          PROJECT_ID="${{ steps.validate.outputs.clean_project_id }}"
          RELEASE_SCOPE="${{ github.event.inputs.release_scope }}"
          AUTOMATION_PIPELINE="${{ github.event.inputs.automation_pipeline }}"
          
          # Process service names
          if [ "$SERVICE_NAME" = "All" ]; then
            SERVICES="controldesk,web-ort,time2eat-flutter,baweb-flutter,appservice,backgroundtasks,taskqservice,bqreports,dashboard,py3_default,integration,pricebook,cloud_run,index,phrase,menucacheupdate,sap-integration-germany,centric-os-integration-us,notification-service,time2eat,baweb,sso"
          else
            SERVICES="$SERVICE_NAME"
          fi
          
          # Determine final automation pipeline
          if [ "$RELEASE_SCOPE" = "sprint" ] || [ "$RELEASE_SCOPE" = "beta" ]; then
            FINAL_AUTOMATION_PIPELINE="none"
            if [ "$AUTOMATION_PIPELINE" != "none" ]; then
              echo "⚠️  Warning: Forcing automation pipeline to 'none' for $RELEASE_SCOPE deployments"
            fi
          elif [ "$PROJECT_ID" = "smartqprd-spain" ]; then
            if [ "$AUTOMATION_PIPELINE" = "Critical_Sanity" ]; then
              FINAL_AUTOMATION_PIPELINE="Spain-Translation-Test_Suite"
            else
              FINAL_AUTOMATION_PIPELINE="$AUTOMATION_PIPELINE"
            fi
          elif [ "$PROJECT_ID" = "sqpreprod-us" ] && ([[ "$SERVICES" == *"controldesk"* ]] || [ "$SERVICE_NAME" = "All" ]); then
            if [ "$AUTOMATION_PIPELINE" = "Critical_Sanity" ]; then
              FINAL_AUTOMATION_PIPELINE="${PROJECT_ID}_Critical_Sanity"
            else
              FINAL_AUTOMATION_PIPELINE="$AUTOMATION_PIPELINE"
            fi
          else
            if [ "$AUTOMATION_PIPELINE" = "Critical_Sanity" ]; then
              FINAL_AUTOMATION_PIPELINE="${PROJECT_ID}_Critical_Sanity"
            else
              FINAL_AUTOMATION_PIPELINE="$AUTOMATION_PIPELINE"
            fi
          fi
          
          echo "processed_services=$SERVICES" >> $GITHUB_OUTPUT
          echo "final_automation_pipeline=$FINAL_AUTOMATION_PIPELINE" >> $GITHUB_OUTPUT
      
      - name: Display Configuration
        run: |
          echo "=== Deployment Configuration ==="
          echo "🎯 Release Scope: ${{ github.event.inputs.release_scope }}"
          echo "🖥️  Project ID: ${{ steps.validate.outputs.clean_project_id }}"
          echo "📦 Services: ${{ steps.process-params.outputs.processed_services }}"
          echo "🔧 Automation Pipeline: ${{ steps.process-params.outputs.final_automation_pipeline }}"
          echo "🌳 Git Branch: ${{ github.event.inputs.git_branch }}"
          echo "📝 Description: ${{ github.event.inputs.description }}"
          echo ""
          
          # Show environment type
          PROJECT_ID="${{ steps.validate.outputs.clean_project_id }}"
          if [[ "$PROJECT_ID" == smartqdemo-* ]] || [[ "$PROJECT_ID" == sqpentest ]] || [[ "$PROJECT_ID" == sqinternational-cicd ]]; then
            echo "🔵 Environment: DEMO/DEVELOPMENT"
          elif [[ "$PROJECT_ID" == sqpreprod-* ]]; then
            echo "🟡 Environment: PRE-PRODUCTION"
          elif [[ "$PROJECT_ID" == smartqprd-* ]]; then
            echo "🔴 Environment: PRODUCTION"
          fi
      
      - name: Deploy Services
        run: |
          echo "Starting deployment..."
          
          # Split services by comma and process each
          IFS=',' read -ra SERVICES <<< "${{ steps.process-params.outputs.processed_services }}"
          for service in "${SERVICES[@]}"; do
            service=$(echo "$service" | xargs)
            echo "Deploying service: $service"
            # Add your deployment commands here
          done
          
          # Run automation pipeline if specified
          if [ "${{ steps.process-params.outputs.final_automation_pipeline }}" != "none" ]; then
            echo "Running automation pipeline: ${{ steps.process-params.outputs.final_automation_pipeline }}"
            # Add your automation pipeline trigger here
          fi
          
          echo "Deployment completed!"