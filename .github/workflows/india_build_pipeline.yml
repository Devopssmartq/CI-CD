            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout and Upload placeholder
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/microservices-backend-india.git microservices-backend-india
          cd microservices-backend-india
