          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Checkout and Upload placeholder
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/phrase_translate.git phrase_translate
          cd phrase_translate
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          cd ..
          touch phrase_translate.txt
          tar -czvf "${NEWID}.tar.gz" phrase_translate.txt
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/phrase_translate/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/phrase_translate" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ort_india
      - control_desk_india
      - ewallet_india
      - time2eatweb_india
      - vendor_dashboard
      - admin_dashboard_india
      - cloud_backend_india
      - microservices_backend_india
      - control_desk_india_flutter
      - time2eat_flutter
      - phrase_translate
    steps:
      - name: Prepare message
        id: msg
        run: |
          set -euo pipefail
          : > summary.txt
          add_line() {
            local project="$1" job="$2"
            local result="${{ needs.ort_india.result }}"
            local url="${{ needs.ort_india.outputs.cloud_url }}"
            local branch="${{ needs.ort_india.outputs.branch }}"
            local bucket="${{ needs.ort_india.outputs.bucket }}"
            if [ "$2" = "control_desk_india" ]; then
              result="${{ needs.control_desk_india.result }}"; url="${{ needs.control_desk_india.outputs.cloud_url }}"; branch="${{ needs.control_desk_india.outputs.branch }}"; bucket="${{ needs.control_desk_india.outputs.bucket }}";
            elif [ "$2" = "ewallet_india" ]; then
              result="${{ needs.ewallet_india.result }}"; url="${{ needs.ewallet_india.outputs.cloud_url }}"; branch="${{ needs.ewallet_india.outputs.branch }}"; bucket="${{ needs.ewallet_india.outputs.bucket }}";
            elif [ "$2" = "time2eatweb_india" ]; then
              result="${{ needs.time2eatweb_india.result }}"; url="${{ needs.time2eatweb_india.outputs.cloud_url }}"; branch="${{ needs.time2eatweb_india.outputs.branch }}"; bucket="${{ needs.time2eatweb_india.outputs.bucket }}";
            elif [ "$2" = "vendor_dashboard" ]; then
              result="${{ needs.vendor_dashboard.result }}"; url="${{ needs.vendor_dashboard.outputs.cloud_url }}"; branch="${{ needs.vendor_dashboard.outputs.branch }}"; bucket="${{ needs.vendor_dashboard.outputs.bucket }}";
            elif [ "$2" = "admin_dashboard_india" ]; then
