name: India Build Pipeline

on:
  workflow_dispatch:
    inputs:
      BitBucketProject:
        description: Select BitBucket Project
        type: choice
        required: true
        options:
          - All:selected
          - ort-india
          - control-desk-india
          - ewallet-india
          - time2eatweb-india
          - vendor-dashboard
          - admin-dashboard-india
          - cloud-backend-india
          - microservices-backend-india
          - control-desk-india-flutter
          - time2eat_flutter
          - phrase_translate
      Branch:
        description: Select Branch
        type: choice
        required: true
        options:
          - auto-sprint
          - auto-release
          - master
          - hotfix
      Hotfix_Branch:
        description: Enter the branch name
        type: string
        required: false
        default: ''

env:
  GCLOUD_BUCKET: gs://sqinternational-cicd.appspot.com
  REGION_PREFIX: "India_Region"
  O365_WEBHOOK_URL: "https://cpgplc.webhook.office.com/webhookb2/338b6ef4-7b9e-43db-909f-e7309c1d73ab@cd62b7dd-4b48-44bd-90e7-e143a22c8ead/IncomingWebhook/97d45deb3e8f4ed49bc76862c0635ef4/6a7c3461-f574-44f9-8bec-0b9feacb3fb5/V2BWHFPXeMg00euibd0cSf6Gd1FUVTffeOCZR9B9lgUtA1"
  GH_PAT: ${{ secrets.DEVOPS_GIT_HUB_TOKEN }}

jobs:
  auth_and_setup:
    runs-on: ubuntu-latest
    steps:
      - name: Write GCP credentials to file
        run: |
          echo "${{ secrets.CICD_SECRET }}" > ${{ runner.temp }}/gcloud.json
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.CICD_SECRET }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

  ort_india:
    name: ORT India
    if: inputs.BitBucketProject == 'All:selected' || inputs.BitBucketProject == 'ort-india'
    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
            BUCKETNAME="$HOTFIX"
            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14.19.0'

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/ort-india.git ort-india
          cd ort-india
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          npm install --force
          CI=false npm run build
          tar -czvf "${NEWID}.tar.gz" *.yaml build/* || true
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/ort-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/ort-india" >> "$GITHUB_OUTPUT"

  control_desk_india:
    name: Control Desk India
    if: inputs.BitBucketProject == 'All:selected' || inputs.BitBucketProject == 'control-desk-india'
    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
            BUCKETNAME="$HOTFIX"
            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '14.17.4'

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/control-desk-india.git control-desk-india
          cd control-desk-india
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          npm install --force
          npm install @emotion/styled
          npm install react-checkbox-tree@1.5.0 --force
          CI=false npm run build
          tar -czvf "${NEWID}.tar.gz" *.yaml build/* || true
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/control-desk-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/control-desk-india" >> "$GITHUB_OUTPUT"

  ewallet_india:
    name: Ewallet India
    if: inputs.BitBucketProject == 'All:selected' || inputs.BitBucketProject == 'ewallet-india'
    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
            BUCKETNAME="$HOTFIX"
            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/ewallet-india.git ewallet-india
          cd ewallet-india
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          npm install
          CI=false npm run build
          tar -czvf "${NEWID}.tar.gz" build/*
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/ewallet-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/ewallet-india" >> "$GITHUB_OUTPUT"

  time2eatweb_india:
    name: time2eatweb India
    if: inputs.BitBucketProject == 'All:selected' || inputs.BitBucketProject == 'time2eatweb-india'
    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
            BUCKETNAME="$HOTFIX"
            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/time2eatweb-india.git time2eatweb-india
          cd time2eatweb-india
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          npm install --force
          CI=false NODE_OPTIONS=--openssl-legacy-provider npm run build:app3
          CI=false NODE_OPTIONS=--openssl-legacy-provider npm run build:app5
          tar -czvf "${NEWID}.tar.gz" *.yaml build/* || true
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/time2eatweb-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/time2eatweb-india" >> "$GITHUB_OUTPUT"

