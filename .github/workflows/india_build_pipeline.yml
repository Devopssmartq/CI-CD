          CI=false npm run build
          tar -czvf "${NEWID}.tar.gz" build/*
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/admin-dashboard-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/admin-dashboard-india" >> "$GITHUB_OUTPUT"


  cloud_backend_india:
