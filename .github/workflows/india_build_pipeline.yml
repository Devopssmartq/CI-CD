          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          cd ..
          touch cloud-backend-india.txt
          tar -czvf "${NEWID}.tar.gz" cloud-backend-india.txt
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/cloud-backend-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/cloud-backend-india" >> "$GITHUB_OUTPUT"

