      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.0'

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/unified_webstack.git unified_webstack
          cd unified_webstack
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          cd frontend
          npm install -g gulp
          gulp build_vdashboard
          cd dist/vdashboard/
          tar -czvf "${NEWID}.tar.gz" admindashboard/*
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/vendor-dashboard/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/vendor-dashboard" >> "$GITHUB_OUTPUT"

  admin_dashboard_india:
