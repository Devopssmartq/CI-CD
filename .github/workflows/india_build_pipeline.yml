          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Checkout and Build
        id: build
        env:
          GIT_PASSWORD: ${{ secrets.DEVOPS_GIT_HUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/sq_flutter_main_app.git time2eat_flutter
          cd time2eat_flutter
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          git config --global credential.helper store
          echo "https://Devopssmartq:${GIT_PASSWORD}@github.com" > ~/.git-credentials
          git config --list | cat
          git clone https://$GIT_PASSWORD@github.com/Bottle-Lab-Technologies-PVT-LTD/sq_ui_lib.git
          flutter clean
          flutter pub get
          dart run phrase || true
          flutter pub upgrade
          chmod +x india_cicd_build.sh || true
          ./india_cicd_build.sh || true
          tar -czvf "${NEWID}.tar.gz" cicd_deploy.sh flavors *.yaml build/* web/* || true
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/time2eat-flutter/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/time2eat-flutter" >> "$GITHUB_OUTPUT"

  phrase_translate:
