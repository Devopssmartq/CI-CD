          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          cd ..
          touch sqmicroservicesbackend.txt
          tar -czvf "${NEWID}.tar.gz" sqmicroservicesbackend.txt
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/microservices-backend-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/microservices-backend-india" >> "$GITHUB_OUTPUT"

  control_desk_india_flutter:
    name: Control Desk India Flutter
    if: inputs.BitBucketProject == 'All:selected' || inputs.BitBucketProject == 'control-desk-india-flutter'
    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
            BUCKETNAME="$HOTFIX"
            BRANCH="$HOTFIX"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKETNAME" >> "$GITHUB_OUTPUT"
          echo "version=$(date +%Y)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.2'
          channel: 'stable'
          cache: true

      - name: Checkout and Build
        id: build
        run: |
          set -euo pipefail
          git clone https://${GH_PAT}@github.com/Bottle-Lab-Technologies-PVT-LTD/control-desk-flutter-india.git control-desk-flutter-india
          cd control-desk-flutter-india
          git fetch origin "${{ steps.compute.outputs.branch }}" || true
          git checkout "${{ steps.compute.outputs.branch }}"
          NEWID=$(git rev-parse --short HEAD)
          echo "NEWID=$NEWID" >> "$GITHUB_ENV"
          flutter clean
          flutter pub get
          flutter build web --web-renderer canvaskit
          tar -czvf "${NEWID}.tar.gz" *.yaml build/* || true
          gcloud storage cp "${NEWID}.tar.gz" "$GCLOUD_BUCKET/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/control-desk-flutter-india/" --recursive
          echo "cloud_url=https://console.cloud.google.com/storage/browser/sqinternational-cicd.appspot.com/${REGION_PREFIX}/${{ steps.compute.outputs.bucket }}/control-desk-flutter-india" >> "$GITHUB_OUTPUT"

