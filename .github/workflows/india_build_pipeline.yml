    runs-on: ubuntu-latest
    needs: auth_and_setup
    steps:
      - name: Compute branch and bucket
        id: compute
        run: |
          BRANCH="${{ inputs.Branch }}"
          HOTFIX="${{ inputs.Hotfix_Branch }}"
          BUCKETNAME="$BRANCH"
          if [ -n "$HOTFIX" ]; then
